<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchulados · Servicio de Salón</title>
<meta name="theme-color" content="#1B1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}

:root{
  --chile:#C1272D;
  --chile-d:#A3202A;
  --maiz:#E0A83A;
  --maiz-d:#8A6516;
  --jade:#2A9D8F;
  --jade-d:#1F7A6E;
  --crema:#FAF4E8;
  --crema-2:#F2E8D5;
  --blanco:#FFFFFF;
  --tinta:#1B1410;
  --txt:#4A4038;
  --txt-suave:#8A7C6C;
  --linea:#EAE0CD;
  --radio:16px;
  --sombra:0 1px 2px rgba(27,20,16,.04),0 12px 28px -18px rgba(27,20,16,.35);
  --fd:"Fraunces",Georgia,serif;
  --fb:"Inter",system-ui,-apple-system,sans-serif;
  --alto-strip:4px;
}

body{
  font-family:var(--fb);
  background:var(--crema);
  color:var(--txt);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,h2,h3{font-family:var(--fd);color:var(--tinta);line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.3rem;font-weight:900}
h2{font-size:1.1rem;font-weight:700}

.top-strip{
  position:fixed;top:0;left:0;right:0;height:var(--alto-strip);z-index:300;
  background:linear-gradient(90deg,var(--chile) 0 25%,var(--maiz) 25% 50%,var(--jade) 50% 75%,#E0714B 75% 100%);
}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,244,232,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linea);
  padding:.9rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
}

.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--fd);font-weight:900;font-size:1.1rem;color:var(--tinta)}
.brand .mark{width:26px;height:26px;color:var(--chile);flex:none}

.top-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:.5rem;background:var(--blanco);border:1px solid var(--linea);border-radius:100px;padding:.25rem .7rem .25rem .25rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--maiz);display:grid;place-items:center;font-weight:700;font-size:.75rem;font-family:var(--fd);flex:none}
.user-chip b{font-size:.78rem;color:var(--tinta);font-weight:600;line-height:1.1}
.user-chip span{display:block;font-size:.65rem;color:var(--txt-suave)}
.btn-salir{background:rgba(193,39,45,.1);color:var(--chile);border-radius:6px;padding:.25rem .5rem;font-size:.72rem;font-weight:700;cursor:pointer}
.btn-salir:hover{background:var(--chile);color:#fff}

.content{padding:1rem;max-width:1200px;margin:0 auto;display:grid;gap:1.2rem}

.grid-salon{display:grid;grid-template-columns:1fr 320px;gap:1.2rem}
@media(max-width:900px){.grid-salon{grid-template-columns:1fr}}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden}
.card-head{display:flex;align-items:center;gap:.8rem;padding:1rem 1.2rem;border-bottom:1px solid var(--linea)}
.card-body{padding:1rem}

.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.8rem}
.mesa-btn{
  background:var(--crema);border:2px solid var(--linea);border-radius:12px;padding:.8rem;
  text-align:center;cursor:pointer;transition:.2s;display:grid;gap:.2rem;
}
.mesa-btn:hover{border-color:var(--chile);background:#FFFCF6;transform:translateY(-2px)}
.mesa-btn.ocupada{background:rgba(193,39,45,.06);border-color:rgba(193,39,45,.3)}
.mesa-btn.ocupada .num{color:var(--chile)}
.mesa-btn .num{font-family:var(--fd);font-weight:900;font-size:1.05rem;color:var(--tinta)}
.mesa-btn .estado{font-size:.7rem;font-weight:600;color:var(--txt-suave)}
.mesa-btn.ocupada .estado{color:var(--chile)}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:100px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--chile);color:#fff;box-shadow:0 8px 20px -10px rgba(193,39,45,.9)}
.btn-primary:hover{background:var(--chile-d)}
.btn-line{border:1px solid var(--linea);color:var(--txt)}
.btn-line:hover{border-color:var(--chile);color:var(--chile)}

.lista-pedidos-rapida{display:grid;gap:.7rem}
.pedido-card{background:var(--crema);border:1px solid var(--linea);border-radius:10px;padding:.8rem;display:grid;gap:.4rem}
.pedido-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.pedido-top b{font-size:.85rem;color:var(--tinta)}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:100px}
.p-cocina{background:rgba(224,168,58,.2);color:var(--maiz-d)}
.p-listo{background:rgba(42,157,143,.15);color:var(--jade-d)}
.pedido-det{font-size:.78rem;color:var(--txt-suave)}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-fondo{position:absolute;inset:0;background:rgba(27,20,16,.55);backdrop-filter:blur(3px)}
.modal-caja{position:relative;background:var(--blanco);border-radius:18px;width:min(460px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden}
.modal-head{display:flex;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--linea)}
.modal-body{padding:1.2rem;display:grid;gap:.9rem}
.field label{display:block;font-size:.76rem;font-weight:600;color:var(--tinte);margin-bottom:.3rem}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--linea);border-radius:10px;padding:.65rem .8rem;font-size:.85rem;background:var(--crema);outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--chile);background:#fff}
.modal-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:1rem 1.2rem;border-top:1px solid var(--linea);background:var(--crema)}

@media(max-width:480px){
  .topbar{padding:.7rem;gap:.5rem}
  .user-chip div{display:none}
  .user-chip{padding:.2rem}
  .mesas-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="top-strip"></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 5c2.4 3.6 6 4.2 6 8.2a6 6 0 1 1-12 0C14 9.2 17.6 8.6 20 5z" fill="currentColor"/>
      <circle cx="20" cy="26" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="20" cy="26" r="4" fill="currentColor"/>
    </svg>
    <span>Enchulados · Salón</span>
  </div>

  <div class="top-tools">
    <button class="btn btn-primary" onclick="abrirModalPedido()">+ Pedido</button>
    <div class="user-chip">
      <span class="avatar" id="avatarSesion">MS</span>
      <div>
        <b id="nombreSesion">Mesera</b>
        <span id="rolSesion">Salón</span>
      </div>
      <button class="btn-salir" onclick="cerrarSesion()" title="Salir">Salir</button>
    </div>
  </div>
</header>

<main class="content">
  <div class="grid-salon">
    
    <div class="card">
      <div class="card-head">
        <h2>Mesas (1 al 12)</h2>
      </div>
      <div class="card-body">
        <div class="mesas-grid" id="gridMesas"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Pedidos en Curso</h2>
      </div>
      <div class="card-body">
        <div class="lista-pedidos-rapida" id="listaPedidosSalon"></div>
      </div>
    </div>

  </div>
</main>

<div class="modal" id="modalPedido">
  <div class="modal-fondo" onclick="cerrarModal()"></div>
  <div class="modal-caja">
    <div class="modal-head">
      <h2>Tomar Pedido de Mesa</h2>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Número de Mesa</label>
        <select id="fMesa">
          <option value="Mesa 1">Mesa 1</option>
          <option value="Mesa 2">Mesa 2</option>
          <option value="Mesa 3">Mesa 3</option>
          <option value="Mesa 4">Mesa 4</option>
          <option value="Mesa 5">Mesa 5</option>
          <option value="Mesa 6">Mesa 6</option>
          <option value="Mesa 7">Mesa 7</option>
          <option value="Mesa 8">Mesa 8</option>
          <option value="Mesa 9">Mesa 9</option>
          <option value="Mesa 10">Mesa 10</option>
          <option value="Mesa 11">Mesa 11</option>
          <option value="Mesa 12">Mesa 12</option>
        </select>
      </div>
      <div class="field">
        <label>Detalle del pedido</label>
        <textarea id="fDetalle" placeholder="Ej: 2 Tacos al pastor, 1 Limonada"></textarea>
      </div>
      <div class="field">
        <label>Valor Total ($)</label>
        <input type="number" id="fTotal" placeholder="35000">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-line" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarPedidoMesa()">Enviar a Cocina</button>
    </div>
  </div>
</div>

<script>
const sesionActual = JSON.parse(localStorage.getItem('enchulados_sesion'));

if (!sesionActual) {
  window.location.href = 'index.html';
} else if (sesionActual.rol !== 'Mesera' && sesionActual.rol !== 'Mesero') {
  if (sesionActual.rol.includes('Admin')) window.location.href = 'panel.html';
  else if (sesionActual.rol.includes('Repart')) window.location.href = 'repartidor.html';
  else window.location.href = 'index.html';
} else {
  document.getElementById('nombreSesion').textContent = sesionActual.nombre;
  document.getElementById('rolSesion').textContent = sesionActual.rol;
  document.getElementById('avatarSesion').textContent = sesionActual.nombre.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}

function cerrarSesion(){
  localStorage.removeItem('enchulados_sesion');
  window.location.href = 'index.html';
}

function renderMesas(){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let html = '';
  for(let i = 1; i <= 12; i++){
    let nombreMesa = 'Mesa ' + i;
    let pedidoMesa = pedidos.find(p => p.tipo === 'Mesa' && p.cliente.includes(nombreMesa) && p.estado !== 'entregado');
    let ocupada = pedidoMesa ? 'ocupada' : '';
    let textoEstado = pedidoMesa ? (pedidoMesa.estado === 'listo' ? '¡Listo!' : 'En cocina') : 'Disponible';
    
    html += `
      <div class="mesa-btn ${ocupada}" onclick="seleccionarMesa(${i})">
        <span class="num">Mesa ${i}</span>
        <span class="estado">${textoEstado}</span>
      </div>
    `;
  }
  document.getElementById('gridMesas').innerHTML = html;

  let pedidosSalon = pedidos.filter(p => p.tipo === 'Mesa' && p.estado !== 'entregado');
  let htmlPedidos = '';
  if(!pedidosSalon.length){
    htmlPedidos = '<p style="font-size:.82rem;color:var(--txt-suave);text-align:center;padding:1rem;">No hay pedidos activos.</p>';
  } else {
    htmlPedidos = pedidosSalon.map(p => `
      <div class="pedido-card">
        <div class="pedido-top">
          <b>${p.cliente}</b>
          <span class="pill p-${p.estado}">${p.estado === 'listo' ? 'Listo' : 'Cocina'}</span>
        </div>
        <div class="pedido-det">${p.detalle}</div>
      </div>
    `).join('');
  }
  document.getElementById('listaPedidosSalon').innerHTML = htmlPedidos;
}

function seleccionarMesa(n){
  document.getElementById('fMesa').value = 'Mesa ' + n;
  abrirModalPedido();
}

function abrirModalPedido(){
  document.getElementById('modalPedido').classList.add('open');
}

function cerrarModal(){
  document.getElementById('modalPedido').classList.remove('open');
}

function guardarPedidoMesa(){
  let mesa = document.getElementById('fMesa').value;
  let detalle = document.getElementById('fDetalle').value.trim();
  let total = parseInt(document.getElementById('fTotal').value) || 0;
  
  if(!detalle){
    alert('Por favor escribe el detalle del pedido.');
    return;
  }

  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let nuevoId = pedidos.length ? Math.max(...pedidos.map(p => p.id)) + 1 : 1050;

  pedidos.push({
    id: nuevoId,
    cliente: mesa + ' · Salón',
    tipo: 'Mesa',
    detalle: detalle,
    total: total,
    estado: 'cocina'
  });

  localStorage.setItem('enchulados_pedidos', JSON.stringify(pedidos));
  cerrarModal();
  document.getElementById('fDetalle').value = '';
  document.getElementById('fTotal').value = '';
  renderMesas();
}

renderMesas();
</script>
</body>
</html>
