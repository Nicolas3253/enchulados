<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enchulados · Iniciar Sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#1B1410" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="franja-superior"></div>

    <div class="contenedor-sesion">
      <div class="cabecera-marca">
        <div class="logo-marca">
          <svg class="marca" viewBox="0 0 40 40" aria-hidden="true">
            <path
              d="M20 5c2.4 3.6 6 4.2 6 8.2a6 6 0 1 1-12 0C14 9.2 17.6 8.6 20 5z"
              fill="currentColor"
            />
            <circle
              cx="20"
              cy="26"
              r="10"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
            />
            <circle cx="20" cy="26" r="4" fill="currentColor" />
          </svg>
          <span>Enchulados</span>
        </div>
        <p class="subtitulo-marca">
          Sistema de Gestión de Procesos Administrativos
        </p>
      </div>

      <div class="tarjeta-sesion">
        <h2>Iniciar sesión</h2>
        <p class="descripcion">Ingresa tus credenciales para acceder a tu panel.</p>

        <div class="caja-alerta" id="cajaAlerta">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 8v5M12 17h.01" />
            <circle cx="12" cy="12" r="9" />
          </svg>
          <span id="mensajeAlerta">Usuario o contraseña incorrectos.</span>
        </div>

        <form class="grupo-formulario" id="formularioSesion" onsubmit="validarLogin(event)">
          <div class="campo">
            <label for="usuario">Usuario</label>
            <div class="envoltorio-entrada">
              <input
                type="text"
                id="usuario"
                placeholder="Ej: usuario"
                required
                autocomplete="username"
              />
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" />
              </svg>
            </div>
          </div>

          <div class="campo">
            <label for="contrasena">Contraseña</label>
            <div class="envoltorio-entrada">
              <input
                type="password"
                id="contrasena"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </div>
          </div>

          <button type="submit" class="boton-ingresar">
            Ingresar al sistema
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </div>

      <p class="derechos-autor">
        Desarrollado por Gisella Pardo · Sharon Gonzales
      </p>
    </div>

    <script src="index.js"> </script>
  </body>
</html>
