<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchulados · Iniciar Sesión</title>
<meta name="theme-color" content="#1B1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ENCHULADOS · Módulo de Autenticación y Login
   Adaptable a PC, Tablet y Móvil
   ============================================================ */

/* ---------- RESET ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- TOKENS / PALETA DE COLORES ---------- */
:root{
  --chile:#C1272D;
  --chile-d:#A3202A;
  --maiz:#E0A83A;
  --maiz-d:#8A6516;
  --jade:#2A9D8F;
  --jade-d:#1F7A6E;
  --crema:#FAF4E8;
  --crema-2:#F2E8D5;
  --blanco:#FFFFFF;
  --tinta:#1B1410;
  --tinta-2:#251C16;
  --txt:#4A4038;
  --txt-suave:#8A7C6C;
  --linea:#EAE0CD;
  --radio:20px;
  --sombra:0 12px 32px -12px rgba(27,20,16,.25);
  --fd:"Fraunces",Georgia,serif;
  --fb:"Inter",system-ui,-apple-system,sans-serif;
  --alto-strip:5px;
}

/* ---------- BASE ---------- */
body{
  font-family:var(--fb);
  background:var(--crema);
  color:var(--txt);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:1.5rem 1rem;
  position:relative;
}

h1,h2,h3{font-family:var(--fd);color:var(--tinta);line-height:1.15;letter-spacing:-.01em}

/* Barra superior decorativa */
.top-strip{
  position:fixed;top:0;left:0;right:0;height:var(--alto-strip);z-index:300;
  background:linear-gradient(90deg,var(--chile) 0 25%,var(--maiz) 25% 50%,var(--jade) 50% 75%,#E0714B 75% 100%);
}

/* ---------- CONTENEDOR PRINCIPAL ---------- */
.login-container{
  width:100%;
  max-width:440px;
  margin:auto;
}

.brand-header{
  text-align:center;
  margin-bottom:1.8rem;
}

.brand-logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  font-family:var(--fd);
  font-weight:900;
  font-size:1.8rem;
  color:var(--tinta);
  margin-bottom:.4rem;
}

.brand-logo .mark{
  width:42px;
  height:42px;
  color:var(--chile);
  flex:none;
}

.brand-subtitle{
  font-size:.85rem;
  color:var(--txt-suave);
  font-weight:500;
}

/* ---------- TARJETA LOGIN ---------- */
.card-login{
  background:var(--blanco);
  border:1px solid var(--linea);
  border-radius:var(--radio);
  box-shadow:var(--sombra);
  padding:2.2rem 1.8rem;
  position:relative;
}

.card-login h2{
  font-size:1.35rem;
  margin-bottom:.3rem;
}

.card-login p.desc{
  font-size:.82rem;
  color:var(--txt-suave);
  margin-bottom:1.6rem;
}

/* ---------- FORMULARIO ---------- */
.form-group{
  display:grid;
  gap:1.2rem;
}

.field{
  display:flex;
  flex-direction:column;
  gap:.4rem;
}

.field label{
  font-size:.8rem;
  font-weight:700;
  color:var(--tinta);
}

.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

.input-wrap svg{
  position:absolute;
  left:1rem;
  width:18px;
  height:18px;
  color:var(--txt-suave);
  pointer-events:none;
  transition:.2s;
}

.input-wrap input{
  width:100%;
  border:1px solid var(--linea);
  border-radius:12px;
  padding:.75rem 1rem .75rem 2.7rem;
  font-size:.9rem;
  background:var(--crema);
  outline:0;
  color:var(--tinta);
  transition:.2s;
}

.input-wrap input:focus{
  border-color:var(--chile);
  background:var(--blanco);
  box-shadow:0 0 0 3px rgba(193,39,45,.12);
}

.input-wrap input:focus + svg{
  color:var(--chile);
}

/* Botón Iniciar Sesión */
.btn-login{
  width:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  padding:.85rem;
  border-radius:100px;
  background:var(--chile);
  color:#fff;
  font-size:.92rem;
  font-weight:700;
  margin-top:.6rem;
  box-shadow:0 10px 22px -10px rgba(193,39,45,.8);
  transition:.2s;
}

.btn-login:hover{
  background:var(--chile-d);
  transform:translateY(-2px);
}

.btn-login svg{
  width:18px;
  height:18px;
}

/* ---------- MENSAJE DE ERROR / ALERTA ---------- */
.alert-box{
  display:none;
  align-items:flex-start;
  gap:.7rem;
  background:rgba(193,39,45,.08);
  border:1px solid rgba(193,39,45,.3);
  border-radius:12px;
  padding:.8rem 1rem;
  margin-bottom:1.2rem;
  font-size:.82rem;
  color:var(--chile-d);
}

.alert-box svg{
  width:18px;
  height:18px;
  flex:none;
  margin-top:2px;
}

.copyright{
  text-align:center;
  margin-top:1.8rem;
  font-size:.74rem;
  color:var(--txt-suave);
}

/* RESPONSIVE */
@media(max-width:480px){
  .card-login{
    padding:1.6rem 1.2rem;
  }
}
</style>
</head>
<body>

<div class="top-strip"></div>

<div class="login-container">
  
  <!-- LOGO E IDENTIDAD -->
  <div class="brand-header">
    <div class="brand-logo">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 5c2.4 3.6 6 4.2 6 8.2a6 6 0 1 1-12 0C14 9.2 17.6 8.6 20 5z" fill="currentColor"/>
        <circle cx="20" cy="26" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>
        <circle cx="20" cy="26" r="4" fill="currentColor"/>
      </svg>
      <span>Enchulados</span>
    </div>
    <p class="brand-subtitle">Sistema de Gestión de Procesos Administrativos</p>
  </div>

  <!-- TARJETA DEL FORMULARIO -->
  <div class="card-login">
    <h2>Iniciar sesión</h2>
    <p class="desc">Ingresa tus credenciales para acceder a tu panel.</p>

    <!-- Caja de alertas (Errores de credenciales, turnos o bloqueos) -->
    <div class="alert-box" id="alertBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      <span id="alertMsg">Usuario o contraseña incorrectos.</span>
    </div>

    <form class="form-group" id="loginForm" onsubmit="validarLogin(event)">
      
      <div class="field">
        <label for="usuario">Usuario</label>
        <div class="input-wrap">
          <input type="text" id="usuario" placeholder="Ej: usuario" required autocomplete="username">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Ingresar al sistema
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

    </form>
  </div>

  <p class="copyright">Desarrollado para el Proyecto de Grado · SENA 2026</p>

</div>

<script>
/* ============================================================
   LÓGICA DE USUARIOS, TURNOS Y PERSISTENCIA (localStorage)
   ============================================================ */

const USUARIOS_BASE = [
  {
    nombre: 'Enchulados Admin',
    usuario: 'admin',
    clave: '1234',
    rol: 'Administrador',
    turnoInicio: '00:00',
    turnoFin: '23:59',
    activo: true
  },
  {
    nombre: 'Gisella Pardo',
    usuario: 'gisella',
    clave: '1234',
    rol: 'Cajera',
    turnoInicio: '14:00',
    turnoFin: '22:00',
    activo: true
  },
  {
    nombre: 'Dayana García',
    usuario: 'dayana',
    clave: '1234',
    rol: 'Mesera',
    turnoInicio: '08:00',
    turnoFin: '21:00',
    activo: true
  },
  {
    nombre: 'Sharon González',
    usuario: 'sharon',
    clave: '1234',
    rol: 'Administradora',
    turnoInicio: '00:00',
    turnoFin: '23:59',
    activo: true
  },
  {
    nombre: 'Carlos Rojas',
    usuario: 'carlos',
    clave: '1234',
    rol: 'Repartidor',
    turnoInicio: '18:00',
    turnoFin: '23:00',
    activo: false
  }
];

if (!localStorage.getItem('enchulados_usuarios')) {
  localStorage.setItem('enchulados_usuarios', JSON.stringify(USUARIOS_BASE));
}

function mostrarError(mensaje) {
  const box = document.getElementById('alertBox');
  const msg = document.getElementById('alertMsg');
  msg.textContent = mensaje;
  box.style.display = 'flex';
}

function ocultarError() {
  document.getElementById('alertBox').style.display = 'none';
}

function validarLogin(e) {
  e.preventDefault();
  ocultarError();

  const userIn = document.getElementById('usuario').value.trim().toLowerCase();
  const passIn = document.getElementById('password').value.trim();

  const listaUsuarios = JSON.parse(localStorage.getItem('enchulados_usuarios')) || USUARIOS_BASE;

  const usuarioEncontrado = listaUsuarios.find(u => u.usuario.toLowerCase() === userIn && u.clave === passIn);

  if (!usuarioEncontrado) {
    mostrarError('Usuario o contraseña incorrectos.');
    return;
  }

  if (!usuarioEncontrado.activo) {
    mostrarError('Acceso deshabilitado. Consulta con administración.');
    return;
  }

  if (usuarioEncontrado.rol !== 'Administrador' && usuarioEncontrado.rol !== 'Administradora') {
    const ahora = new Date();
    const horaActual = ahora.getHours().toString().padStart(2, '0') + ':' + ahora.getMinutes().toString().padStart(2, '0');
    
    const inicio = usuarioEncontrado.turnoInicio;
    const fin = usuarioEncontrado.turnoFin;

    if (horaActual < inicio || horaActual > fin) {
      mostrarError(`Fuera de turno laboral. Tu horario asignado es de ${inicio} a ${fin}.`);
      return;
    }
  }

  localStorage.setItem('enchulados_sesion', JSON.stringify({
    nombre: usuarioEncontrado.nombre,
    usuario: usuarioEncontrado.usuario,
    rol: usuarioEncontrado.rol,
    fechaIngreso: new Date().toISOString()
  }));

  // REDIRECCIÓN SEGÚN EL ROL
  const rol = usuarioEncontrado.rol;
  if (rol === 'Administrador' || rol === 'Administradora') {
    window.location.href = 'panel.html';
  } else if (rol === 'Mesera' || rol === 'Mesero') {
    window.location.href = 'mesera.html';
  } else if (rol === 'Cajera' || rol === 'Cajero') {
    window.location.href = 'caja.html';
  } else if (rol === 'Repartidor' || rol === 'Domiciliario') {
    window.location.href = 'repartidor.html';
  } else {
    window.location.href = 'panel.html';
  }
}
</script>
</body>
</html>
