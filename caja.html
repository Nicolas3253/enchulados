<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchulados · Caja y Facturación</title>
<meta name="theme-color" content="#1B1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}

:root{
  --chile:#C1272D;
  --chile-d:#A3202A;
  --maiz:#E0A83A;
  --maiz-d:#8A6516;
  --jade:#2A9D8F;
  --jade-d:#1F7A6E;
  --crema:#FAF4E8;
  --crema-2:#F2E8D5;
  --blanco:#FFFFFF;
  --tinta:#1B1410;
  --txt:#4A4038;
  --txt-suave:#8A7C6C;
  --linea:#EAE0CD;
  --radio:16px;
  --sombra:0 1px 2px rgba(27,20,16,.04),0 12px 28px -18px rgba(27,20,16,.35);
  --fd:"Fraunces",Georgia,serif;
  --fb:"Inter",system-ui,-apple-system,sans-serif;
  --alto-strip:4px;
}

body{
  font-family:var(--fb);
  background:var(--crema);
  color:var(--txt);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,h2,h3{font-family:var(--fd);color:var(--tinta);line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.3rem;font-weight:900}
h2{font-size:1.1rem;font-weight:700}

.top-strip{
  position:fixed;top:0;left:0;right:0;height:var(--alto-strip);z-index:300;
  background:linear-gradient(90deg,var(--chile) 0 25%,var(--maiz) 25% 50%,var(--jade) 50% 75%,#E0714B 75% 100%);
}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,244,232,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linea);
  padding:.9rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
}

.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--fd);font-weight:900;font-size:1.1rem;color:var(--tinta)}
.brand .mark{width:26px;height:26px;color:var(--chile);flex:none}

.top-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:.5rem;background:var(--blanco);border:1px solid var(--linea);border-radius:100px;padding:.25rem .7rem .25rem .25rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--maiz);display:grid;place-items:center;font-weight:700;font-size:.75rem;font-family:var(--fd);flex:none}
.user-chip b{font-size:.78rem;color:var(--tinta);font-weight:600;line-height:1.1}
.user-chip span{display:block;font-size:.65rem;color:var(--txt-suave)}
.btn-salir{background:rgba(193,39,45,.1);color:var(--chile);border-radius:6px;padding:.25rem .5rem;font-size:.72rem;font-weight:700;cursor:pointer}
.btn-salir:hover{background:var(--chile);color:#fff}

.content{padding:1rem;max-width:1000px;margin:0 auto;display:grid;gap:1.2rem}

/* Resumen / Kpis de Caja */
.kpis-caja{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.kpi-c{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem;box-shadow:var(--sombra)}
.kpi-c .lab{font-size:.72rem;color:var(--txt-suave);font-weight:600;text-transform:uppercase}
.kpi-c .val{font-family:var(--fd);font-size:1.4rem;font-weight:900;color:var(--tinta);margin-top:.2rem;font-variant-numeric:tabular-nums}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:1rem 1.2rem;border-bottom:1px solid var(--linea)}
.card-body{padding:1rem;display:grid;gap:1rem}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-suave);font-weight:600;padding:.6rem .8rem;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:.75rem .8rem;border-bottom:1px solid var(--linea);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FFFCF6}
td.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tinta);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:100px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--maiz-d);color:#fff;box-shadow:0 8px 20px -10px rgba(138,101,22,.9)}
.btn-primary:hover{background:#705111}

.vacio{text-align:center;padding:2.5rem 1rem;color:var(--txt-suave)}
.vacio p{font-size:.86rem}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal-fondo{position:absolute;inset:0;background:rgba(27,20,16,.55);backdrop-filter:blur(3px)}
.modal-caja{position:relative;background:var(--blanco);border-radius:18px;width:min(440px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden}
.modal-head{display:flex;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--linea)}
.modal-body{padding:1.2rem;display:grid;gap:.9rem}
.field label{display:block;font-size:.76rem;font-weight:600;color:var(--tinta);margin-bottom:.3rem}
.field input, .field textarea{width:100%;border:1px solid var(--linea);border-radius:10px;padding:.65rem .8rem;font-size:.88rem;background:var(--crema);outline:0}
.field input:focus, .field textarea:focus{border-color:var(--chile);background:#fff}
.field textarea{resize:vertical;min-height:80px}
.modal-foot{display:flex;gap:.5rem;justify-content:flex-end;padding:1rem 1.2rem;border-top:1px solid var(--linea);background:var(--crema)}

.pago-info{background:var(--crema);padding:.8rem 1rem;border-radius:12px;display:grid;gap:.3rem;font-size:.85rem}
.pago-info b{color:var(--tinta)}

.toast{position:fixed;bottom:1rem;right:1rem;background:var(--tinta);color:#fff;padding:.7rem 1rem;border-radius:10px;font-size:.8rem;z-index:500;box-shadow:var(--sombra)}

@media(max-width:768px){
  .kpis-caja{grid-template-columns:1fr}
}
@media(max-width:480px){
  .topbar{padding:.7rem;gap:.5rem}
  .user-chip div{display:none}
  .user-chip{padding:.2rem}
}
</style>
</head>
<body>

<div class="top-strip"></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 5c2.4 3.6 6 4.2 6 8.2a6 6 0 1 1-12 0C14 9.2 17.6 8.6 20 5z" fill="currentColor"/>
      <circle cx="20" cy="26" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="20" cy="26" r="4" fill="currentColor"/>
    </svg>
    <span>Enchulados · Caja</span>
  </div>

  <div class="top-tools">
    <div class="user-chip">
      <span class="avatar" id="avatarSesion">CJ</span>
      <div>
        <b id="nombreSesion">Cajera</b>
        <span id="rolSesion">Caja</span>
      </div>
      <button class="btn-salir" onclick="cerrarSesion()" title="Salir">Salir</button>
    </div>
  </div>
</header>

<main class="content">
  
  <!-- KPIS / BALANCE DE CAJA -->
  <div class="kpis-caja">
    <div class="kpi-c">
      <div class="lab">Ingresos Totales Hoy</div>
      <div class="val" id="lblTotalIngresos">$0</div>
    </div>
    <div class="kpi-c">
      <div class="lab">Pedidos Facturados</div>
      <div class="val" id="lblTotalFacturados">0</div>
    </div>
    <div class="kpi-c">
      <div class="lab">Base / Cambio Inicial</div>
      <div class="val">$100.000</div>
    </div>
  </div>

  <!-- TABLA DE COBROS PENDIENTES -->
  <div class="card">
    <div class="card-head">
      <h2>Cobros y Facturación Pendiente</h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Cliente / Mesa</th>
            <th>Detalle</th>
            <th>Total</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaCaja"></tbody>
      </table>
    </div>
  </div>

  <!-- SECCIÓN DE NOTAS / BALANCE DE TURNO -->
  <div class="card">
    <div class="card-head">
      <h2>Notas y Cuadre de Caja</h2>
      <span style="font-size:.78rem; color:var(--txt-suave);">Evita descuadres anotando novedades del turno</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>Observaciones del turno (Billetes retenidos, base, ajustes, etc.)</label>
        <textarea id="txtNotasCaja" placeholder="Escribe aquí cualquier novedad para el administrador..."></textarea>
      </div>
      <div>
        <button class="btn btn-primary" onclick="guardarNotasCaja()">Guardar Notas de Caja</button>
      </div>
    </div>
  </div>

</main>

<div class="modal" id="modalCobro">
  <div class="modal-fondo" onclick="cerrarModal()"></div>
  <div class="modal-caja">
    <div class="modal-head">
      <h2 id="tituloCobro">Cobrar Pedido</h2>
    </div>
    <div class="modal-body">
      <div class="pago-info" id="detalleCobro"></div>
      <div class="field">
        <label>Efectivo Recibido ($)</label>
        <input type="number" id="efectivoRecibido" placeholder="Ej: 50000" oninput="calcularVueltas()">
      </div>
      <div class="pago-info">
        <span>Cambio / Vueltas:</span>
        <b id="lblVueltas" style="font-size:1.1rem; color:var(--jade-d);">$0</b>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-line" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarPago()">Cobrar y Facturar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none;"></div>

<script>
const sesionActual = JSON.parse(localStorage.getItem('enchulados_sesion'));
if(!sesionActual){
  window.location.href = 'index.html';
} else if(sesionActual.rol !== 'Cajera' && sesionActual.rol !== 'Cajero' && !sesionActual.rol.includes('Admin')){
  if(sesionActual.rol.includes('Mese')) window.location.href = 'mesera.html';
  else if(sesionActual.rol.includes('Repart')) window.location.href = 'repartidor.html';
  else window.location.href = 'index.html';
} else {
  document.getElementById('nombreSesion').textContent = sesionActual.nombre;
  document.getElementById('rolSesion').textContent = sesionActual.rol;
  document.getElementById('avatarSesion').textContent = sesionActual.nombre.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}

function cerrarSesion(){
  localStorage.removeItem('enchulados_sesion');
  window.location.href = 'index.html';
}

let pedidoActualId = null;
let totalActualValor = 0;

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=> t.style.display = 'none', 3000);
}

function renderCaja(){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let pendientes = pedidos.filter(p => p.estado !== 'entregado');
  let entregados = pedidos.filter(p => p.estado === 'entregado');
  let contenedor = document.getElementById('tablaCaja');

  // Calcular ingresos y total facturados basados en entregados
  let ingresosTotales = entregados.reduce((acc, p) => acc + (p.total || 0), 0);
  document.getElementById('lblTotalIngresos').textContent = '$' + ingresosTotales.toLocaleString('es-CO');
  document.getElementById('lblTotalFacturados').textContent = entregados.length;

  if(!pendientes.length){
    contenedor.innerHTML = '<tr><td colspan="5"><div class="vacio"><p>No hay pedidos pendientes de cobro.</p></div></td></tr>';
  } else {
    contenedor.innerHTML = pendientes.map(p => `
      <tr>
        <td class="num">#${p.id}</td>
        <td><strong>${p.cliente}</strong></td>
        <td style="font-size:.8rem; color:var(--txt-suave);">${p.detalle}</td>
        <td class="num">$${p.total.toLocaleString('es-CO')}</td>
        <td><button class="btn btn-primary" onclick="abrirCobro(${p.id})">Cobrar</button></td>
      </tr>
    `).join('');
  }

  // Cargar notas guardadas si existen
  let notasGuardadas = localStorage.getItem('enchulados_notas_caja') || '';
  document.getElementById('txtNotasCaja').value = notasGuardadas;
}

function abrirCobro(id){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let p = pedidos.find(x => x.id === id);
  if(!p) return;

  pedidoActualId = p.id;
  totalActualValor = p.total;

  document.getElementById('tituloCobro').textContent = 'Cobrar Pedido #' + p.id;
  document.getElementById('detalleCobro').innerHTML = `
    <div><b>Cliente:</b> ${p.cliente}</div>
    <div><b>Detalle:</b> ${p.detalle}</div>
    <div><b>Total a pagar:</b> <span style="color:var(--chile); font-size:1rem;">$${p.total.toLocaleString('es-CO')}</span></div>
  `;
  document.getElementById('efectivoRecibido').value = '';
  document.getElementById('lblVueltas').textContent = '$0';
  document.getElementById('modalCobro').classList.add('open');
}

function calcularVueltas(){
  let recibido = parseInt(document.getElementById('efectivoRecibido').value) || 0;
  let vueltas = recibido - totalActualValor;
  let lbl = document.getElementById('lblVueltas');
  if(vueltas >= 0){
    lbl.textContent = '$' + vueltas.toLocaleString('es-CO');
    lbl.style.color = 'var(--jade-d)';
  } else {
    lbl.textContent = 'Faltan dinero ($' + Math.abs(vueltas).toLocaleString('es-CO') + ')';
    lbl.style.color = 'var(--chile)';
  }
}

function confirmarPago(){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let p = pedidos.find(x => x.id === pedidoActualId);
  if(p){
    p.estado = 'entregado';
    localStorage.setItem('enchulados_pedidos', JSON.stringify(pedidos));
    cerrarModal();
    renderCaja();
    mostrarToast('¡Pedido cobrado y facturado con éxito!');
  }
}

function cerrarModal(){
  document.getElementById('modalCobro').classList.remove('open');
}

function guardarNotasCaja(){
  let notas = document.getElementById('txtNotasCaja').value;
  localStorage.setItem('enchulados_notas_caja', notas);
  mostrarToast('Notas de caja guardadas correctamente.');
}

renderCaja();
</script>
</body>
</html>
