<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchulados · Zona de Repartidores</title>
<meta name="theme-color" content="#1B1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}

:root{
  --chile:#C1272D;
  --chile-d:#A3202A;
  --maiz:#E0A83A;
  --maiz-d:#8A6516;
  --jade:#2A9D8F;
  --jade-d:#1F7A6E;
  --crema:#FAF4E8;
  --crema-2:#F2E8D5;
  --blanco:#FFFFFF;
  --tinta:#1B1410;
  --txt:#4A4038;
  --txt-suave:#8A7C6C;
  --linea:#EAE0CD;
  --radio:16px;
  --sombra:0 1px 2px rgba(27,20,16,.04),0 12px 28px -18px rgba(27,20,16,.35);
  --fd:"Fraunces",Georgia,serif;
  --fb:"Inter",system-ui,-apple-system,sans-serif;
  --alto-strip:4px;
}

body{
  font-family:var(--fb);
  background:var(--crema);
  color:var(--txt);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,h2,h3{font-family:var(--fd);color:var(--tinta);line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.3rem;font-weight:900}
h2{font-size:1.1rem;font-weight:700}

.top-strip{
  position:fixed;top:0;left:0;right:0;height:var(--alto-strip);z-index:300;
  background:linear-gradient(90deg,var(--chile) 0 25%,var(--maiz) 25% 50%,var(--jade) 50% 75%,#E0714B 75% 100%);
}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,244,232,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linea);
  padding:.9rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
}

.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--fd);font-weight:900;font-size:1.1rem;color:var(--tinta)}
.brand .mark{width:26px;height:26px;color:var(--chile);flex:none}

.top-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:.5rem;background:var(--blanco);border:1px solid var(--linea);border-radius:100px;padding:.25rem .7rem .25rem .25rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--maiz);display:grid;place-items:center;font-weight:700;font-size:.75rem;font-family:var(--fd);flex:none}
.user-chip b{font-size:.78rem;color:var(--tinta);font-weight:600;line-height:1.1}
.user-chip span{display:block;font-size:.65rem;color:var(--txt-suave)}
.btn-salir{background:rgba(193,39,45,.1);color:var(--chile);border-radius:6px;padding:.25rem .5rem;font-size:.72rem;font-weight:700;cursor:pointer}
.btn-salir:hover{background:var(--chile);color:#fff}

.content{padding:1rem;max-width:800px;margin:0 auto;display:grid;gap:1.2rem}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden}
.card-head{display:flex;align-items:center;gap:.8rem;padding:1rem 1.2rem;border-bottom:1px solid var(--linea)}
.card-body{padding:1rem;display:grid;gap:1rem}

.domicilio-card{
  background:var(--crema);border:1px solid var(--linea);border-radius:14px;padding:1.1rem;
  display:grid;gap:.8rem;transition:.2s;
}
.domicilio-card:hover{border-color:var(--jade)}
.dom-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.dom-top b{font-size:.95rem;color:var(--tinta)}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;padding:.2rem .5rem;border-radius:100px}
.p-listo{background:rgba(42,157,143,.15);color:var(--jade-d)}
.p-cocina{background:rgba(224,168,58,.2);color:var(--maiz-d)}

.dom-info{display:grid;gap:.3rem;font-size:.85rem;color:var(--txt)}
.dom-info span{color:var(--txt-suave);font-size:.78rem}
.dom-acciones{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.3rem}

.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:100px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--jade);color:#fff;box-shadow:0 8px 20px -10px rgba(42,157,143,.9)}
.btn-primary:hover{background:var(--jade-d)}
.btn-line{border:1px solid var(--linea);color:var(--txt)}
.btn-line:hover{border-color:var(--chile);color:var(--chile)}

.vacio{text-align:center;padding:2.5rem 1rem;color:var(--txt-suave)}
.vacio p{font-size:.86rem}

@media(max-width:480px){
  .topbar{padding:.7rem;gap:.5rem}
  .user-chip div{display:none}
  .user-chip{padding:.2rem}
}
</style>
</head>
<body>

<div class="top-strip"></div>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 5c2.4 3.6 6 4.2 6 8.2a6 6 0 1 1-12 0C14 9.2 17.6 8.6 20 5z" fill="currentColor"/>
      <circle cx="20" cy="26" r="10" fill="none" stroke="currentColor" stroke-width="2.6"/>
      <circle cx="20" cy="26" r="4" fill="currentColor"/>
    </svg>
    <span>Enchulados · Repartos</span>
  </div>

  <div class="top-tools">
    <div class="user-chip">
      <span class="avatar" id="avatarSesion">RP</span>
      <div>
        <b id="nombreSesion">Repartidor</b>
        <span id="rolSesion">Domicilios</span>
      </div>
      <button class="btn-salir" onclick="cerrarSesion()" title="Salir">Salir</button>
    </div>
  </div>
</header>

<main class="content">
  <div class="card">
    <div class="card-head">
      <h2>Domicilios y Envíos Activos</h2>
    </div>
    <div class="card-body" id="listaDomicilios">
    </div>
  </div>
</main>

<script>
const sesionActual = JSON.parse(localStorage.getItem('enchulados_sesion'));

if (!sesionActual) {
  window.location.href = 'index.html';
} else if (sesionActual.rol !== 'Repartidor' && sesionActual.rol !== 'Domiciliario') {
  if (sesionActual.rol.includes('Admin')) window.location.href = 'panel.html';
  else if (sesionActual.rol.includes('Mese')) window.location.href = 'mesera.html';
  else window.location.href = 'index.html';
} else {
  document.getElementById('nombreSesion').textContent = sesionActual.nombre;
  document.getElementById('rolSesion').textContent = sesionActual.rol;
  document.getElementById('avatarSesion').textContent = sesionActual.nombre.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}

function cerrarSesion(){
  localStorage.removeItem('enchulados_sesion');
  window.location.href = 'index.html';
}

function renderDomicilios(){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let domicilios = pedidos.filter(p => p.tipo === 'Domicilio' && p.estado !== 'entregado');
  
  let contenedor = document.getElementById('listaDomicilios');
  
  if(!domicilios.length){
    contenedor.innerHTML = '<div class="vacio"><p>No hay domicilios pendientes en este momento.</p></div>';
    return;
  }

  contenedor.innerHTML = domicilios.map(p => `
    <div class="domicilio-card">
      <div class="dom-top">
        <b>Pedido #${p.id}</b>
        <span class="pill p-${p.estado}">${p.estado === 'listo' ? 'Listo para llevar' : 'Preparándose'}</span>
      </div>
      <div class="dom-info">
        <div><span>Cliente / Dirección:</span><br><strong>${p.cliente}</strong></div>
        <div><span>Contenido:</span><br>${p.detalle}</div>
        <div><span>Total a cobrar:</span><br><strong>$${p.total.toLocaleString('es-CO')}</strong></div>
      </div>
      <div class="dom-acciones">
        <button class="btn btn-primary" onclick="marcarEntregado(${p.id})">Marcar como Entregado</button>
      </div>
    </div>
  `).join('');
}

function marcarEntregado(id){
  let pedidos = JSON.parse(localStorage.getItem('enchulados_pedidos')) || [];
  let p = pedidos.find(x => x.id === id);
  if(p){
    p.estado = 'entregado';
    localStorage.setItem('enchulados_pedidos', JSON.stringify(pedidos));
    renderDomicilios();
  }
}

renderDomicilios();
</script>
</body>
</html>
